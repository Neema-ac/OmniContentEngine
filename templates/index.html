<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OmniClip Pro • Creator Automation Engine</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
        }
      }
    }
  </script>
  <style>
    body { background-color: #0B0F17; color: #F3F4F6; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0B0F17; }
    ::-webkit-scrollbar-thumb { background: #1F2937; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #374151; }
  </style>
</head>
<body class="font-sans antialiased selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SAMPLE_SCRIPT = `Hook: 90% of developers are building AI agents completely wrong, and it's bankrupting their OpenAI bill.
Body: We spent $14,000 on LangChain agents last quarter before realizing that context windows were ballooning due to unpruned chat histories. When state expands beyond 30k tokens, attention drifts and tool calls hallucinate.
Fix: Switch to a state-graph router. Instead of one monolithic agent, use deterministic regex filters first, pass clean JSON schemas with Pydantic, and force hard checkpoints every 3 cycles.`;

    const PACING_OPTIONS = [
      "High Velocity (Retention Focus)",
      "Deep Dive Masterclass",
      "Aggressive & Contrarian",
    ];

    function downloadDataUri(dataUri, filename) {
      const a = document.createElement("a");
      a.href = dataUri;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function buildBriefMarkdown(data) {
      const a = data.retention_audit;
      const lines = [
        "# OmniClip Pro — Production Brief",
        "",
        "## Retention Audit",
        `- Virality Score: ${a.virality_score}/100 (${a.pacing_rating})`,
        `- Critical Drop-off Risk: ${a.critical_dropoff_risk}`,
        `- Hook Strength Analysis: ${a.hook_strength_analysis}`,
        `- Estimated Retention Curve (%): ${a.estimated_retention_curve.join(", ")}`,
        "",
        "## Thumbnail Concepts",
      ];
      data.thumbnail_blueprints.forEach((t, i) => {
        lines.push(`### ${i + 1}. ${t.concept_name}`);
        lines.push(`- Overlay text: "${t.overlay_text}"`);
        lines.push(`- Subtext: ${t.sub_text}`);
        lines.push(`- Palette: ${t.color_palette}`);
        lines.push(`- Focal subject: ${t.focal_subject}`);
        lines.push(`- Composition: ${t.composition_layout}`);
        lines.push(`- PNG file: ${t.concept_name.replace(/\s+/g, "_")}.png (download separately from the Thumbnails tab)`);
        lines.push("");
      });
      lines.push("## Production Cue Sheet");
      data.production_cues.forEach((c) => {
        lines.push(`- **${c.timestamp_estimate}** — ${c.visual_broll} | SFX: ${c.audio_sfx}`);
      });
      lines.push("", "## High-CTR YouTube Titles");
      data.youtube_titles.forEach((t) => lines.push(`- ${t}`));
      lines.push("", "## Shorts / Reels Hooks");
      data.viral_hook_variations.forEach((h) => lines.push(`- ${h}`));
      lines.push("", "## X / Twitter Seed Thread", data.x_thread_first_tweet);
      lines.push("", "## Executive Strategy Summary", data.full_export_summary);
      return lines.join("\n");
    }

    function downloadBrief(data) {
      const markdown = buildBriefMarkdown(data);
      const blob = new Blob([markdown], { type: "text/markdown" });
      const url = URL.createObjectURL(blob);
      downloadDataUri(url, "omniclip-production-brief.md");
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function App() {
      const [script, setScript] = useState(SAMPLE_SCRIPT);
      const [pacing, setPacing] = useState(PACING_OPTIONS[0]);
      const [activeTab, setActiveTab] = useState('thumbnails');
      const [isLoading, setIsLoading] = useState(false);
      const [error, setError] = useState(null);
      const [data, setData] = useState(null);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [activeTab, data, isLoading, error]);

      const handleGenerate = async () => {
        if (!script.trim() || isLoading) return;
        setIsLoading(true);
        setError(null);
        try {
          const res = await fetch('/api/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ script, pacing }),
          });
          const json = await res.json();
          if (!res.ok) {
            throw new Error(json.error || `Request failed (${res.status})`);
          }
          setData(json);
          setActiveTab('thumbnails');
        } catch (err) {
          setError(err.message || 'Something went wrong.');
        } finally {
          setIsLoading(false);
        }
      };

      const audit = data?.retention_audit;

      return (
        <div className="flex h-screen w-screen overflow-hidden bg-[#0B0F17]">
          {/* SIDEBAR */}
          <aside className="w-80 border-r border-gray-800 bg-[#0E131F] flex flex-col justify-between p-5 overflow-y-auto">
            <div className="space-y-6">
              <div className="flex items-center gap-3">
                <div className="h-9 w-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-400 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                  <i data-lucide="zap" className="w-5 h-5 text-white"></i>
                </div>
                <div>
                  <h1 className="text-base font-bold tracking-tight text-white flex items-center gap-1.5">
                    OmniClip <span className="text-xs px-1.5 py-0.5 rounded bg-indigo-500/20 text-indigo-400 font-mono">PRO</span>
                  </h1>
                  <p className="text-xs text-gray-500">Autonomous Channel Engine</p>
                </div>
              </div>

              <div>
                <label className="text-xs font-semibold text-gray-400 uppercase tracking-wider block mb-2">Script / Concept Notes</label>
                <textarea
                  value={script}
                  onChange={(e) => setScript(e.target.value)}
                  rows={7}
                  className="w-full bg-[#161D2B] border border-gray-800 rounded-lg px-3 py-2 text-xs text-gray-200 font-mono placeholder-gray-600 focus:outline-none focus:border-indigo-500 resize-none"
                  placeholder="Paste your script, hook, or rough notes..."
                />
                <button
                  onClick={() => setScript(SAMPLE_SCRIPT)}
                  className="mt-2 text-[11px] text-indigo-400 hover:text-indigo-300"
                >
                  Load sample script
                </button>
              </div>

              <div>
                <label className="text-xs font-semibold text-gray-400 uppercase tracking-wider block mb-2">Pacing Profile</label>
                <select
                  value={pacing}
                  onChange={(e) => setPacing(e.target.value)}
                  className="w-full bg-[#161D2B] border border-gray-800 rounded-lg px-3 py-2 text-xs text-gray-200 focus:outline-none focus:border-indigo-500"
                >
                  {PACING_OPTIONS.map((p) => <option key={p}>{p}</option>)}
                </select>
              </div>

              {audit && (
                <div className="p-4 rounded-xl bg-gradient-to-b from-[#141B2A] to-[#101622] border border-gray-800/80 shadow-inner">
                  <span className="text-[11px] font-semibold text-gray-400 uppercase tracking-wider block">Algorithmic Virality Score</span>
                  <div className="flex items-baseline gap-2 mt-1">
                    <span className="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-200">
                      {audit.virality_score}
                    </span>
                    <span className="text-xs text-gray-500">/ 100</span>
                  </div>
                  <div className="w-full bg-gray-800 h-1.5 rounded-full mt-3 overflow-hidden">
                    <div
                      className="bg-gradient-to-r from-emerald-500 to-teal-400 h-full rounded-full transition-all duration-700"
                      style={{ width: `${audit.virality_score}%` }}
                    ></div>
                  </div>
                  <span className="text-[11px] text-gray-400 block mt-2">⚡ {audit.pacing_rating}</span>
                </div>
              )}

              {data && (
                <button
                  onClick={() => downloadBrief(data)}
                  className="w-full py-2.5 px-3 rounded-lg bg-[#161D2B] border border-gray-800 text-xs text-gray-300 hover:text-white hover:border-indigo-500 flex items-center justify-center gap-2 transition"
                >
                  <i data-lucide="file-down" className="w-3.5 h-3.5"></i>
                  Export Full Brief (.md)
                </button>
              )}

              {error && (
                <div className="p-3 rounded-lg bg-red-950/40 border border-red-900 text-xs text-red-300">
                  {error}
                </div>
              )}
            </div>

            <button
              onClick={handleGenerate}
              disabled={isLoading || !script.trim()}
              className="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-indigo-600 hover:from-indigo-500 to-violet-600 text-white font-semibold text-xs tracking-wide shadow-lg shadow-indigo-600/25 flex items-center justify-center gap-2 transition-all active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed"
            >
              {isLoading ? (
                <>
                  <i data-lucide="loader-2" className="w-4 h-4 animate-spin"></i>
                  <span>Analyzing Script...</span>
                </>
              ) : (
                <>
                  <i data-lucide="sparkles" className="w-4 h-4"></i>
                  <span>Run Automation Engine</span>
                </>
              )}
            </button>
          </aside>

          {/* MAIN */}
          <main className="flex-1 flex flex-col overflow-hidden">
            <div className="flex border-b border-gray-800 px-6">
              {[
                { id: 'thumbnails', label: 'Visual Thumbnails', icon: 'image' },
                { id: 'cues', label: 'B-Roll & Audio Cue Sheet', icon: 'film' },
                { id: 'retention', label: 'Retention & Drop-off', icon: 'trending-up' },
                { id: 'social', label: 'Multi-Platform Copy', icon: 'share-2' },
              ].map((tab) => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`flex items-center gap-2 px-4 py-3.5 text-sm font-medium border-b-2 transition ${
                    activeTab === tab.id
                      ? 'border-indigo-500 text-white'
                      : 'border-transparent text-gray-500 hover:text-gray-300'
                  }`}
                >
                  <i data-lucide={tab.icon} className="w-4 h-4"></i>
                  {tab.label}
                </button>
              ))}
            </div>

            <div className="flex-1 overflow-y-auto p-6">
              {!data && !isLoading && (
                <div className="h-full flex flex-col items-center justify-center text-center text-gray-500 gap-2">
                  <i data-lucide="wand-2" className="w-8 h-8"></i>
                  <p className="text-sm">Paste a script and run the engine to generate a full production suite.</p>
                </div>
              )}

              {isLoading && !data && (
                <div className="h-full flex flex-col items-center justify-center text-center text-gray-400 gap-2">
                  <i data-lucide="loader-2" className="w-8 h-8 animate-spin"></i>
                  <p className="text-sm">Generating retention audit, thumbnails, and copy...</p>
                </div>
              )}

              {data && activeTab === 'thumbnails' && (
                <div className="space-y-4">
                  <div>
                    <h2 className="text-lg font-bold text-white tracking-tight">Algorithmic Thumbnail Prototypes</h2>
                    <p className="text-xs text-gray-400">Rendered as real downloadable PNGs, not just descriptions.</p>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                    {data.thumbnail_blueprints.map((t, i) => (
                      <div key={i} className="rounded-xl overflow-hidden border border-gray-800 bg-[#121826] flex flex-col">
                        <div className="relative aspect-video bg-black">
                          {t.thumbnail_image ? (
                            <img src={t.thumbnail_image} alt={t.concept_name} className="w-full h-full object-cover" />
                          ) : (
                            <div className="w-full h-full flex items-center justify-center text-xs text-gray-600">
                              Image unavailable
                            </div>
                          )}
                          <span className="absolute top-2 left-2 text-[10px] font-semibold uppercase tracking-wide bg-black/60 text-white px-2 py-1 rounded">
                            {t.concept_name}
                          </span>
                        </div>
                        <div className="p-4 space-y-3 flex-1 flex flex-col justify-between text-xs">
                          <div>
                            <span className="text-gray-400 font-semibold block mb-1">Focal Subject & Emotion</span>
                            <p className="text-gray-300 leading-relaxed">{t.focal_subject}</p>
                          </div>
                          <div className="pt-2 border-t border-gray-800/60">
                            <span className="text-gray-400 font-semibold block mb-1">Composition Layout</span>
                            <p className="text-gray-400">{t.composition_layout}</p>
                          </div>
                          <div className="flex items-center justify-between pt-2 border-t border-gray-800/60">
                            <span className="text-[11px] text-gray-400 font-mono">{t.color_palette}</span>
                            {t.thumbnail_image && (
                              <button
                                onClick={() => downloadDataUri(t.thumbnail_image, `${t.concept_name.replace(/\s+/g, '_')}.png`)}
                                className="text-[11px] text-indigo-400 hover:text-indigo-300 flex items-center gap-1"
                              >
                                <i data-lucide="download" className="w-3 h-3"></i> PNG
                              </button>
                            )}
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {data && activeTab === 'cues' && (
                <div className="space-y-4">
                  <div>
                    <h2 className="text-lg font-bold text-white tracking-tight">Timeline & Production Cue Sheet</h2>
                    <p className="text-xs text-gray-400">Chronological asset directions for editors and motion designers.</p>
                  </div>
                  <div className="border border-gray-800 rounded-xl overflow-hidden bg-[#121826]">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-[#161F31] border-b border-gray-800 text-gray-400 font-semibold uppercase tracking-wider">
                        <tr>
                          <th className="p-3.5 w-40 font-mono">Timestamp</th>
                          <th className="p-3.5">Visual Cut / B-Roll Directive</th>
                          <th className="p-3.5 w-72">Sound Design & SFX Cue</th>
                          <th className="p-3.5 w-16"></th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-gray-800">
                        {data.production_cues.map((c, i) => (
                          <tr key={i} className="hover:bg-white/[0.02] transition group">
                            <td className="p-3.5 font-mono text-indigo-400 font-bold whitespace-nowrap">{c.timestamp_estimate}</td>
                            <td className="p-3.5 text-gray-200">{c.visual_broll}</td>
                            <td className="p-3.5 text-gray-400 italic">{c.audio_sfx}</td>
                            <td className="p-3.5">
                              <button
                                onClick={() => navigator.clipboard.writeText(`${c.timestamp_estimate} — ${c.visual_broll} | SFX: ${c.audio_sfx}`)}
                                className="opacity-0 group-hover:opacity-100 text-gray-500 hover:text-white text-[11px] px-2 py-1 rounded bg-gray-800 hover:bg-gray-700 transition"
                              >
                                Copy
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {data && activeTab === 'retention' && (
                <div className="space-y-6">
                  <div>
                    <h2 className="text-lg font-bold text-white tracking-tight">Algorithmic Retention Forecaster</h2>
                    <p className="text-xs text-gray-400">Predicted viewer drop-off based on pacing and narrative friction.</p>
                  </div>

                  <div className="p-6 rounded-2xl bg-[#121826] border border-gray-800">
                    <span className="text-xs font-semibold text-gray-400 uppercase tracking-wider block mb-4">Estimated Viewer Retention (%)</span>
                    <div className="h-44 w-full flex items-end gap-3 pt-6 pb-2 border-b border-gray-800">
                      {audit.estimated_retention_curve.map((val, idx) => (
                        <div key={idx} className="flex-1 flex flex-col items-center gap-2 h-full justify-end">
                          <span className="text-[10px] font-mono text-gray-400">{val}%</span>
                          <div
                            className="w-full rounded-t bg-gradient-to-t from-indigo-600 to-emerald-400 transition-all duration-500 opacity-90 hover:opacity-100"
                            style={{ height: `${val}%` }}
                          ></div>
                          <span className="text-[10px] font-mono text-gray-500 mt-1">P{idx + 1}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div className="p-4 rounded-xl bg-[#121826] border border-gray-800">
                      <span className="text-xs font-bold text-amber-400 uppercase tracking-wider flex items-center gap-2 mb-2">
                        <i data-lucide="alert-triangle" className="w-4 h-4"></i> Critical Drop-off Bottleneck
                      </span>
                      <p className="text-xs text-gray-300 leading-relaxed">{audit.critical_dropoff_risk}</p>
                    </div>
                    <div className="p-4 rounded-xl bg-[#121826] border border-gray-800">
                      <span className="text-xs font-bold text-emerald-400 uppercase tracking-wider flex items-center gap-2 mb-2">
                        <i data-lucide="check-circle-2" className="w-4 h-4"></i> Hook Strength Analysis
                      </span>
                      <p className="text-xs text-gray-300 leading-relaxed">{audit.hook_strength_analysis}</p>
                    </div>
                  </div>

                  <div className="p-4 rounded-xl bg-[#121826] border border-gray-800">
                    <span className="text-xs font-bold text-gray-300 uppercase tracking-wider block mb-2">Executive Strategy Summary</span>
                    <p className="text-xs text-gray-300 leading-relaxed">{data.full_export_summary}</p>
                  </div>
                </div>
              )}

              {data && activeTab === 'social' && (
                <div className="space-y-6">
                  <div>
                    <h2 className="text-lg font-bold text-white tracking-tight">Cross-Platform Distribution Suite</h2>
                    <p className="text-xs text-gray-400">High-CTR titles, vertical hooks, and a conversation-starting thread.</p>
                  </div>

                  <div className="space-y-4">
                    <div className="p-5 rounded-xl bg-[#121826] border border-gray-800">
                      <span className="text-xs font-bold text-red-400 uppercase tracking-wider block mb-3">High-CTR YouTube Titles</span>
                      <div className="space-y-2">
                        {data.youtube_titles.map((title, i) => (
                          <div key={i} className="p-2.5 rounded-lg bg-[#161F31] border border-gray-800 font-mono text-xs text-gray-200 flex justify-between items-center">
                            <span>{title}</span>
                            <button
                              onClick={() => navigator.clipboard.writeText(title)}
                              className="text-gray-500 hover:text-white text-xs px-2 py-1 rounded bg-gray-800 hover:bg-gray-700"
                            >
                              Copy
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="p-5 rounded-xl bg-[#121826] border border-gray-800">
                      <span className="text-xs font-bold text-sky-400 uppercase tracking-wider block mb-3">Vertical Video Hooks (Shorts / Reels / TikTok)</span>
                      <div className="space-y-2">
                        {data.viral_hook_variations.map((hook, i) => (
                          <div key={i} className="p-3 rounded-lg bg-[#161F31] text-xs text-gray-300 border-l-2 border-sky-400 flex justify-between items-start gap-3">
                            <span>{hook}</span>
                            <button
                              onClick={() => navigator.clipboard.writeText(hook)}
                              className="shrink-0 text-gray-500 hover:text-white text-[11px] px-2 py-1 rounded bg-gray-800 hover:bg-gray-700"
                            >
                              Copy
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="p-5 rounded-xl bg-[#121826] border border-gray-800">
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-xs font-bold text-gray-300 uppercase tracking-wider">Seed Thread Starter (X / Twitter)</span>
                        <button
                          onClick={() => navigator.clipboard.writeText(data.x_thread_first_tweet)}
                          className="text-gray-500 hover:text-white text-[11px] px-2 py-1 rounded bg-gray-800 hover:bg-gray-700"
                        >
                          Copy
                        </button>
                      </div>
                      <pre className="p-3 rounded-lg bg-[#161F31] text-xs text-gray-300 font-mono whitespace-pre-wrap leading-relaxed">{data.x_thread_first_tweet}</pre>
                    </div>
                  </div>
                </div>
              )}
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
